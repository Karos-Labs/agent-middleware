name: CI

# The single source of truth for "does this commit pass". Runs on its own for
# pull requests, and is called as a reusable workflow by both deploys — so a
# deploy can never ship something CI would have rejected.
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_call:

concurrency:
  # Per-ref: a new push supersedes an in-flight run of the same branch/PR, but
  # main and a PR never cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test · Lint · Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Runs first: it needs no credentials, no network and no emulator (the
      # suite fakes Pub/Sub and Firestore), so it is both the fastest signal
      # and the one most likely to catch a real regression.
      - name: Run tests
        run: pytest -q

      - name: Lint
        run: ruff check .

      # `scripts/` as well as `app/`: the migration seeder imports the same
      # service layer the API does, so a signature change that breaks it is a
      # real break even though nothing serves it.
      - name: Type-check
        run: mypy app scripts

      # AU52. A one-time inventory is accurate for one afternoon, so this runs
      # on every commit. It fails on a variable the code reads and .env.example
      # does not document, on a substitution a workflow passes that
      # cloudbuild.yaml never declares, and on prep and prod being wired from
      # different variable sets. It only WARNS on wired-but-unread: every
      # variable here is read through a pydantic field rather than by name, so
      # absence of evidence is not evidence of absence, and this must never
      # become a deletion list.
      - name: Config inventory
        run: python scripts/config_inventory.py --check

      # There was no dependency gate in this repository at all: a supply-chain
      # advisory could land in what the container installs and ship with
      # nothing anywhere saying so.
      #
      # `-r requirements.txt` rather than the resolved environment, because
      # that file IS what the Dockerfile installs — auditing the dev
      # environment would fail on a test runner that never ships and teach
      # people to route around this step.
      #
      # No accepted-advisory list here, deliberately. There is nothing to
      # accept today (`No known vulnerabilities found`, 2026-09-22), and an
      # exception mechanism written before the first exception is a mechanism
      # nobody has had to justify. Add one when a real advisory forces the
      # argument — agent-engine's `scripts/check-dependency-audit.mjs` is the
      # shape to copy, where each acceptance is a dated entry with a stated
      # reason rather than a lowered threshold.
      - name: Production dependency advisories
        run: pip-audit -r requirements.txt --progress-spinner off
