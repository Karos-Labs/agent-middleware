name: Deploy to Prep

# Every push to main that passes CI is built and deployed to the
# agent-middleware Cloud Run service in karoscmo-prep. Production is never
# touched here — see deploy-prod.yml, which is manual by design.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

concurrency:
  # Not cancel-in-progress: killing a half-finished `gcloud run deploy` is a
  # worse outcome than waiting for it.
  group: deploy-prep
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation — no service-account key

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build & deploy (prep)
    needs: ci
    runs-on: ubuntu-latest
    environment: prep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Fail on a missing variable rather than deploying a service with a
      # blank Firestore database or, worse, a blank AUTH_AUDIENCE — which the
      # app answers with a 500 on every request.
      - name: Validate required repo variables
        run: |
          missing=()
          for v in PREP_PROJECT_ID PREP_SERVICE_ACCOUNT PREP_FIRESTORE_PROJECT_ID \
                   PREP_PUBSUB_JOB_TOPIC PREP_GCS_ARTIFACTS_BUCKET PREP_AUTH_AUDIENCE \
                   GCP_WIF_PROVIDER GCP_DEPLOYER_SA; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required repo variable(s): ${missing[*]}"
            exit 1
          fi
          # pydantic-settings parses this one as JSON at import time, so a
          # malformed value does not surface as a config error — it surfaces as
          # a container that will not start, six minutes later, as a stack
          # trace about lifespan context managers.
          printf '%s' "$ALLOWED" | python3 -c 'import json,sys; p=json.load(sys.stdin); assert isinstance(p,list) and all(isinstance(x,str) for x in p)' \
            || { echo "::error::PREP_AUTH_ALLOWED_SERVICE_ACCOUNTS must be a JSON array of strings, got: ${ALLOWED}"; exit 1; }
        env:
          ALLOWED: ${{ vars.PREP_AUTH_ALLOWED_SERVICE_ACCOUNTS || '[]' }}
          PREP_PROJECT_ID: ${{ vars.PREP_PROJECT_ID }}
          PREP_SERVICE_ACCOUNT: ${{ vars.PREP_SERVICE_ACCOUNT }}
          PREP_FIRESTORE_PROJECT_ID: ${{ vars.PREP_FIRESTORE_PROJECT_ID }}
          PREP_PUBSUB_JOB_TOPIC: ${{ vars.PREP_PUBSUB_JOB_TOPIC }}
          PREP_GCS_ARTIFACTS_BUCKET: ${{ vars.PREP_GCS_ARTIFACTS_BUCKET }}
          PREP_AUTH_AUDIENCE: ${{ vars.PREP_AUTH_AUDIENCE }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set active project
        run: gcloud config set project "${{ vars.PREP_PROJECT_ID }}"

      # Values arrive as environment variables rather than `${{ }}` expanded
      # into the script text. Expansion happens before bash parses the line, so
      # a value containing a double quote is re-parsed as shell syntax:
      # AUTH_ALLOWED_SERVICE_ACCOUNTS is a JSON array, and its inner quotes were
      # being eaten, delivering [sa@x.com] to the container, which is not JSON.
      # It is also how a repo variable would become shell injection.
      #
      # `^|^` rather than the default comma for the same reason cloudbuild.yaml
      # uses it: that JSON array gains a comma the moment a second caller is
      # allowed, and a comma-delimited substitution list would split it
      # mid-value. No substitution value can contain a pipe.
      - name: Build & deploy via Cloud Build
        env:
          SHA: ${{ github.sha }}
          REGION: ${{ vars.PREP_REGION || 'us-central1' }}
          PROJECT_ID: ${{ vars.PREP_PROJECT_ID }}
          SERVICE_ACCOUNT: ${{ vars.PREP_SERVICE_ACCOUNT }}
          PUBSUB_JOB_TOPIC: ${{ vars.PREP_PUBSUB_JOB_TOPIC }}
          FIRESTORE_PROJECT_ID: ${{ vars.PREP_FIRESTORE_PROJECT_ID }}
          FIRESTORE_DATABASE: ${{ vars.PREP_FIRESTORE_DATABASE_ID || 'prep' }}
          GCS_ARTIFACTS_BUCKET: ${{ vars.PREP_GCS_ARTIFACTS_BUCKET }}
          AUTH_AUDIENCE: ${{ vars.PREP_AUTH_AUDIENCE }}
          AUTH_ALLOWED_SERVICE_ACCOUNTS: ${{ vars.PREP_AUTH_ALLOWED_SERVICE_ACCOUNTS || '[]' }}
          # The configuration plane. Both default to empty, which is a
          # supported deployment: the service starts and the /config routes
          # answer 503 naming the variable. cloudbuild.yaml refuses a deploy
          # with one set and not the other.
          CLOUDSQL_INSTANCE: ${{ vars.PREP_CLOUDSQL_INSTANCE }}
          CONFIG_DB_DSN: ${{ vars.PREP_CONFIG_DB_DSN }}
        run: |
          gcloud builds submit \
            --project="$PROJECT_ID" \
            --config=cloudbuild.yaml \
            --substitutions="^|^COMMIT_SHA=$SHA|_REGION=$REGION|_SERVICE=agent-middleware|_SERVICE_ACCOUNT=$SERVICE_ACCOUNT|_ENVIRONMENT=staging|_GCP_PROJECT_ID=$PROJECT_ID|_PUBSUB_JOB_TOPIC_ID=$PUBSUB_JOB_TOPIC|_FIRESTORE_PROJECT_ID=$FIRESTORE_PROJECT_ID|_FIRESTORE_DATABASE=$FIRESTORE_DATABASE|_GCS_ARTIFACTS_BUCKET=$GCS_ARTIFACTS_BUCKET|_AUTH_AUDIENCE=$AUTH_AUDIENCE|_AUTH_ALLOWED_SERVICE_ACCOUNTS=$AUTH_ALLOWED_SERVICE_ACCOUNTS|_CLOUDSQL_INSTANCE=$CLOUDSQL_INSTANCE|_CONFIG_DB_DSN=$CONFIG_DB_DSN"

      # A deploy that starts but cannot reach Firestore is worse than a failed
      # one, because nothing else will tell you until a dispatch fails.
      - name: Verify the new revision is serving
        run: |
          URL=$(gcloud run services describe agent-middleware \
            --project="${{ vars.PREP_PROJECT_ID }}" \
            --region="${{ vars.PREP_REGION || 'us-central1' }}" \
            --format='value(status.url)')
          echo "Deployed: $URL"
          gcloud run services describe agent-middleware \
            --project="${{ vars.PREP_PROJECT_ID }}" \
            --region="${{ vars.PREP_REGION || 'us-central1' }}" \
            --format='value(status.conditions)' | grep -q 'True' \
            || { echo "::error::Revision is not Ready"; exit 1; }
