# Build the control plane image and deploy it to one Cloud Run service.
#
# Invoked by .github/workflows/deploy-{prep,prod}.yml; the environment is
# entirely a matter of substitutions, so the two workflows differ only in the
# values they pass.
#
# One-time setup per environment (prep is already done — see the session notes
# in README.md):
#
#   1. A runtime service account, e.g.
#        gcloud iam service-accounts create agent-middleware-sa --project=$PROJECT
#   2. Grant it:
#        roles/datastore.user            on the FIRESTORE project (karoscmo)
#        roles/pubsub.publisher          on the run-jobs topic (topic-scoped)
#   3. Let karos-cmo call it:
#        gcloud run services add-iam-policy-binding agent-middleware \
#          --member="serviceAccount:<karos-cmo runtime SA>" --role=roles/run.invoker
#   4. Widen the GitHub WIF provider's attributeCondition to trust
#      repo:karoslabs/agent-middleware. This is an IAM trust boundary — every
#      workflow in that repo gains the deployer SA's rights — so it is a
#      deliberate change, not something a deploy should perform for itself.

substitutions:
  _REGION: us-central1
  _REPO: karos
  _SERVICE: agent-middleware
  _SERVICE_ACCOUNT: ""
  _ENVIRONMENT: staging
  _GCP_PROJECT_ID: ""
  _PUBSUB_JOB_TOPIC_ID: ""
  _FIRESTORE_PROJECT_ID: ""
  _FIRESTORE_DATABASE: ""
  _GCS_ARTIFACTS_BUCKET: ""
  # This service's own Cloud Run URL. Mandatory: app/security.py refuses to
  # verify an identity token without an audience to bind it to, because Google
  # issues valid tokens to every account on every project and the audience is
  # the only claim that ties one to this service.
  _AUTH_AUDIENCE: ""
  # JSON array of caller service-account emails.
  _AUTH_ALLOWED_SERVICE_ACCOUNTS: "[]"
  # Caller principal -> role, as a JSON object. Empty is the DEFAULT and is a
  # supported deployment -- it means authorization is not configured, and every
  # verified caller holds `admin`, which is exactly the behaviour this service
  # had before roles existed. Startup logs an ERROR saying so, and that line is
  # the whole point: the state is safe and must not be mistakeable for a
  # configured one.
  #
  # This substitution exists because without it the state was not REACHABLE.
  # `--set-env-vars` replaces the whole set and this variable was not in it, so
  # `AUTH_ROLE_BINDINGS` fell back to its `{}` default on every revision and
  # turning authorization on required a code change and a redeploy. S3 built
  # the model; this makes it configuration.
  #
  # Populate prep and prod TOGETHER. One environment enforcing and the other
  # not means they disagree about who may write, which is the parity failure
  # AU52 is about -- and the direction of the mistake is the dangerous one,
  # because the permissive side is the one that keeps working.
  _AUTH_ROLE_BINDINGS: "{}"
  # The configuration plane (S2/S4/S6). Both empty is a valid, supported
  # deployment: the service starts, the /config routes answer 503 naming the
  # variable, and everything else is unaffected. Both set is the wired
  # deployment. Exactly one set is refused below, because that combination is
  # the one that looks deployed and is not -- a DSN with no attached instance
  # points at a unix socket the container does not have.
  #
  # No secret lives here. With IAM database authentication the DSN carries a
  # principal and a socket path and no password, which is the whole reason to
  # prefer it over Secret Manager for this value.
  _CLOUDSQL_INSTANCE: ""
  _CONFIG_DB_DSN: ""

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    # A script rather than a flat `args` list, for one reason: the Cloud SQL
    # flags have to be present or absent, and a flat list can only make them
    # empty. `--set-cloudsql-instances=` with no value is not "leave it
    # alone", and an env var set to "" is not the same as unset -- the
    # settings loader treats "" as configured-and-blank.
    args:
      - -c
      - |
        set -euo pipefail

        # Every substitution is captured in SINGLE quotes first, and nothing
        # below interpolates one again. Cloud Build pastes these in as text,
        # and AUTH_ALLOWED_SERVICE_ACCOUNTS is a JSON array -- so the value
        # arrives carrying double quotes of its own, which would end a
        # double-quoted shell string and silently deploy a mangled allow-list.
        # A single quote in any of these would break this in turn; none can
        # appear in a service-account email, a bucket name, a Firestore
        # database id or a DSN.
        environment='${_ENVIRONMENT}'
        gcp_project='${_GCP_PROJECT_ID}'
        job_topic='${_PUBSUB_JOB_TOPIC_ID}'
        fs_project='${_FIRESTORE_PROJECT_ID}'
        fs_database='${_FIRESTORE_DATABASE}'
        artifacts_bucket='${_GCS_ARTIFACTS_BUCKET}'
        auth_audience='${_AUTH_AUDIENCE}'
        auth_callers='${_AUTH_ALLOWED_SERVICE_ACCOUNTS}'
        auth_roles='${_AUTH_ROLE_BINDINGS}'
        dsn='${_CONFIG_DB_DSN}'
        instance='${_CLOUDSQL_INSTANCE}'

        # `^|^` delimiter, not the default comma: the allow-list is a JSON
        # array that will contain commas as soon as there are two callers, and
        # a comma-delimited list would split it mid-value. `|` cannot appear
        # in a service-account email, a bucket name, or a DSN.
        env_vars="ENVIRONMENT=$${environment}"
        env_vars="$${env_vars}|LOG_LEVEL=INFO"
        env_vars="$${env_vars}|GCP_PROJECT_ID=$${gcp_project}"
        env_vars="$${env_vars}|PUBSUB_JOB_TOPIC_ID=$${job_topic}"
        env_vars="$${env_vars}|FIRESTORE_PROJECT_ID=$${fs_project}"
        env_vars="$${env_vars}|FIRESTORE_DATABASE=$${fs_database}"
        env_vars="$${env_vars}|GCS_ARTIFACTS_BUCKET=$${artifacts_bucket}"
        env_vars="$${env_vars}|AUTH_ENABLED=true"
        env_vars="$${env_vars}|AUTH_AUDIENCE=$${auth_audience}"
        env_vars="$${env_vars}|AUTH_ALLOWED_SERVICE_ACCOUNTS=$${auth_callers}"
        env_vars="$${env_vars}|AUTH_ROLE_BINDINGS=$${auth_roles}"

        if { [ -n "$${dsn}" ] && [ -z "$${instance}" ]; } \
        || { [ -z "$${dsn}" ] && [ -n "$${instance}" ]; }; then
          echo "refusing to deploy: _CONFIG_DB_DSN and _CLOUDSQL_INSTANCE go" >&2
          echo "together. A DSN with no attached instance points at" >&2
          echo "/cloudsql/... inside a container that has no such socket, and" >&2
          echo "an attached instance nothing connects to is a Cloud SQL" >&2
          echo "connection charged for and unused. Set both or neither." >&2
          exit 1
        fi

        sql_flag="--clear-cloudsql-instances"
        if [ -n "$${dsn}" ]; then
          env_vars="$${env_vars}|CONFIG_DB_DSN=$${dsn}"
          sql_flag="--set-cloudsql-instances=$${instance}"
        fi

        # Both flags are declarative on purpose. `--set-env-vars` replaces the
        # whole set and `--set-cloudsql-instances` replaces the whole list, so
        # the deployed revision is exactly what this file says -- and a value
        # somebody added by hand in the Console is removed rather than
        # silently kept, which is what makes this file the answer to "what is
        # configured" instead of one of two answers.
        gcloud run deploy ${_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA \
          --region=${_REGION} \
          --no-allow-unauthenticated \
          --service-account=${_SERVICE_ACCOUNT} \
          --memory=1Gi \
          "$${sql_flag}" \
          "--set-env-vars=^|^$${env_vars}"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
